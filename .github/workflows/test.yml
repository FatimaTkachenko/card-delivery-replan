name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Chrome and ChromeDriver
      run: |
        # Устанавливаем переменную с последней стабильной версией
        CHROME_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE)
        echo "Using Chrome version: $CHROME_VERSION"
        
        # Скачиваем Chrome
        wget -q "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
        # Скачиваем ChromeDriver
        wget -q "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chromedriver-linux64.zip"
        
        # Распаковываем
        unzip -q chrome-linux64.zip
        unzip -q chromedriver-linux64.zip
        
        # Устанавливаем
        sudo mv chrome-linux64 /opt/chrome
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        sudo ln -s /opt/chrome/chrome /usr/local/bin/google-chrome
        
        # Проверяем версии
        echo "Chrome version: $(google-chrome --version)"
        echo "ChromeDriver version: $(chromedriver --version)"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with Gradle
      run: ./gradlew test -Dselenide.headless=true